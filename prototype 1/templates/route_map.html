<script>
    // Function to calculate route cost
    function calculateRouteCost() {
        const vehicleType = document.getElementById('vehicle-type').value;
        const startCoords = [-36.8081595, 174.7903341]; // Origin coordinates from map
        const endCoords = [-37.0318096, 174.8608675]; // Destination coordinates from map
        
        // Show loading state
        document.getElementById('cost-loading').style.display = 'block';
        document.getElementById('cost-details').style.opacity = '0.5';
        
        const requestData = {
            start_coords: startCoords,
            end_coords: endCoords,
            vehicle_type: vehicleType,
            fuel_type: vehicleType.startsWith('ev_') ? 'ev_charging' : '91_unleaded',
            time_of_day: 'midday',
            include_parking: false,
            include_tolls: true
        };
        
        fetch('/api/calculate-cost', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
            },
            body: JSON.stringify(requestData)
        })
        .then(response => response.json())
        .then(data => {
            // Hide loading state
            document.getElementById('cost-loading').style.display = 'none';
            document.getElementById('cost-details').style.opacity = '1';
            
            if (data.success) {
                displayCostResults(data.data);
            } else {
                console.error('Cost calculation failed:', data.error);
                displayError('Failed to calculate costs');
            }
        })
        .catch(error => {
            console.error('Error:', error);
            document.getElementById('cost-loading').style.display = 'none';
            document.getElementById('cost-details').style.opacity = '1';
            displayError('Network error occurred');
        });
    }
    
    // Function to display cost results
    function displayCostResults(costData) {
        document.getElementById('cost-distance').textContent = costData.distance_km + ' km';
        document.getElementById('cost-time').textContent = costData.travel_time_minutes + ' min';
        document.getElementById('cost-fuel').textContent = '$' + costData.fuel_cost;
        document.getElementById('cost-time-value').textContent = '$' + costData.time_cost;
        document.getElementById('cost-operating').textContent = '$' + costData.operating_costs;
        document.getElementById('cost-toll').textContent = '$' + costData.toll_cost;
        document.getElementById('cost-total').textContent = '$' + costData.total_cost;
        document.getElementById('cost-per-km').textContent = '$' + costData.cost_per_km + '/km';
    }
    
    // Function to display error
    function displayError(message) {
        document.getElementById('cost-distance').textContent = '-';
        document.getElementById('cost-time').textContent = '-';
        document.getElementById('cost-fuel').textContent = '-';
        document.getElementById('cost-time-value').textContent = '-';
        document.getElementById('cost-operating').textContent = '-';
        document.getElementById('cost-toll').textContent = '-';
        document.getElementById('cost-total').textContent = message;
        document.getElementById('cost-per-km').textContent = '-';
    }
    
    // Calculate costs when page loads and when vehicle type changes
    document.addEventListener('DOMContentLoaded', function() {
        calculateRouteCost();
        
        // Add event listener for vehicle type changes
        document.getElementById('vehicle-type').addEventListener('change', calculateRouteCost);
    });
</script>
